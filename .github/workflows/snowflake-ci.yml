name: Snowflake CI

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Snowflake CLI with OIDC
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.16"

      - name: Test Snowflake connection
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        run: snow connection test -x

      - name: Deploy S3 Storage Integration
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_ROLE: GITHUB_DEPLOY_ROLE
        run: |
          snow sql -f snowflake_dbt_project/infrastructure/integrations/s3_integration.sql -x

    
      - name: Deploy Sales Bronze External Stage
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_ROLE: GITHUB_DEPLOY_ROLE
        run: |
          snow sql -f snowflake_dbt_project/infrastructure/stages/sales/bronze/sales_bronze_stage.sql -x

    
      - name: Deploy Sales Bronze File Format
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_ROLE: GITHUB_DEPLOY_ROLE
        run: |
          snow sql -f snowflake_dbt_project/infrastructure/file_formats/sales/bronze/parquet_format.sql -x

      - name: Deploy Sales Bronze Table
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_ROLE: GITHUB_DEPLOY_ROLE
        run: |
          snow sql -f snowflake_dbt_project/infrastructure/tables/sales/bronze/create_raw_sales.sql -x


      - name: Deploy Sales Bronze Ingestion Task
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_ROLE: GITHUB_DEPLOY_ROLE
        run: |
          snow sql -f snowflake_dbt_project/infrastructure/tasks/sales/bronze/load_raw_sales_task.sql -x

      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt Snowflake Adapter
        run: |
          python -m pip install "dbt-core==1.12.0" "dbt-snowflake==1.12.5"

      - name: Verify dbt Installation
        run: dbt --version

      
      - name: Test dbt Snowflake Connection
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        run: |
          cd snowflake_dbt_project
          dbt debug --profiles-dir .





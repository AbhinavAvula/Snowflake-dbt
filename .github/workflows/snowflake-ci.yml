name: Snowflake CI

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Snowflake CLI with OIDC
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.16"

      - name: Test Snowflake connection
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        run: snow connection test -x

      - name: Deploy S3 Storage Integration
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_ROLE: GITHUB_DEPLOY_ROLE
        run: |
          snow sql -f snowflake_dbt_project/infrastructure/integrations/s3_integration.sql -x

    
      - name: Deploy Sales Bronze External Stage
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_ROLE: GITHUB_DEPLOY_ROLE
        run: |
          snow sql -f snowflake_dbt_project/infrastructure/stages/sales/bronze/sales_bronze_stage.sql -x



name: Snowflake CI

on:
  push:
    branches:
      - main
    paths:
      - "snowflake_dbt_project/infrastructure/**"
      - ".github/workflows/snowflake-ci.yml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_ROLE: GITHUB_DEPLOY_ROLE

    steps:
      # Step 1: Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Snowflake CLI with OIDC
      - name: Install Snowflake CLI with OIDC
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.16"

      # Step 3: Validate Snowflake connection
      - name: Test Snowflake connection
        run: snow connection test -x

      # Step 4: Discover and deploy infrastructure SQL
      - name: Deploy Snowflake Infrastructure
        shell: bash
        run: |
          set -euo pipefail

          BASE="snowflake_dbt_project/infrastructure"

          deploy_group() {
            local directory="$1"

            if [ ! -d "$directory" ]; then
              return
            fi

            while IFS= read -r -d '' file; do
              echo "Deploying: $file"
              snow sql -f "$file" -x
            done < <(
              find "$directory" -type f -name "*.sql" -print0 |
              sort -z
            )
          }

          # Execute infrastructure in dependency order
          echo "Deploying storage integrations"
          deploy_group "$BASE/integrations"

          echo "Deploying schemas"
          deploy_group "$BASE/schemas"

          echo "Deploying file formats"
          deploy_group "$BASE/file_formats"

          echo "Deploying external stages"
          deploy_group "$BASE/stages"

          echo "Deploying tables"
          deploy_group "$BASE/tables"

          echo "Snowflake infrastructure deployment completed"
